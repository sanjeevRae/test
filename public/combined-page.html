<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVOX - Complete Experience</title>
  
  <!-- Load React and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Basic styling -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    #root {
      width: 100%;
      height: 100vh;
    }
    
    /* Combined Page Styles */
    .combined-page-container {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 0;
      margin: 0;
    }

    .combined-page-header {
      background: rgba(255, 255, 255, 0.95);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .combined-page-header h1 {
      margin: 0;
      color: #333;
      font-size: 1.8rem;
      font-weight: 600;
    }

    .close-window-btn {
      background: #ff4757;
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .close-window-btn:hover {
      background: #ff3742;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
    }

    .combined-sections {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .combined-section {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .combined-section:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .section-title {
      margin: 0 0 1.5rem 0;
      color: #2c3e50;
      font-size: 1.4rem;
      font-weight: 600;
      padding-bottom: 0.8rem;
      border-bottom: 2px solid #3498db;
      display: inline-block;
    }

    .section-content {
      background: #fff;
      border-radius: 12px;
      padding: 1rem;
      border: 1px solid #e9ecef;
      min-height: 200px;
      overflow: hidden;
    }
    
    .placeholder-content {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
      border-radius: 8px;
      color: #666;
      font-size: 1.1rem;
      font-weight: 500;
      text-align: center;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Simple Navbar Component
    const Navbar = () => {
      return (
        <nav style={{
          background: '#2c3e50',
          padding: '1rem 2rem',
          borderRadius: '8px',
          color: 'white'
        }}>
          <div style={{
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center'
          }}>
            <div style={{ fontSize: '1.5rem', fontWeight: 'bold' }}>
              🚀 EVOX
            </div>
            <div style={{ display: 'flex', gap: '2rem' }}>
              <a href="#" style={{ color: 'white', textDecoration: 'none' }}>Home</a>
              <a href="#" style={{ color: 'white', textDecoration: 'none' }}>Our Solutions</a>
              <a href="#" style={{ color: 'white', textDecoration: 'none' }}>Services</a>
              <a href="#" style={{ color: 'white', textDecoration: 'none' }}>Let's Talk</a>
            </div>
          </div>
        </nav>
      );
    };
    
    // Simple HeroSection Component
    const HeroSection = () => {
      return (
        <div style={{
          background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
          padding: '3rem',
          borderRadius: '8px',
          color: 'white',
          textAlign: 'center'
        }}>
          <h1 style={{ fontSize: '3rem', marginBottom: '1rem', fontWeight: 'bold' }}>
            🛡️ Next-Gen Cybersecurity Solutions
          </h1>
          <p style={{ fontSize: '1.2rem', marginBottom: '2rem', opacity: 0.9 }}>
            Protecting your digital assets with advanced technology and innovative security measures
          </p>
          <button style={{
            background: '#ff6b6b',
            color: 'white',
            border: 'none',
            padding: '1rem 2rem',
            fontSize: '1.1rem',
            borderRadius: '8px',
            cursor: 'pointer',
            fontWeight: 'bold'
          }}>
            Get Started Today
          </button>
        </div>
      );
    };
    
    // Simple HomePage Component
    const HomePage = () => {
      return (
        <div style={{ padding: '2rem' }}>
          <div style={{ textAlign: 'center', marginBottom: '3rem' }}>
            <h2 style={{ fontSize: '2.5rem', color: '#2c3e50', marginBottom: '1rem' }}>
              Welcome to EVOX Technology
            </h2>
            <p style={{ fontSize: '1.1rem', color: '#666', maxWidth: '600px', margin: '0 auto' }}>
              Your trusted partner in cybersecurity excellence. We provide comprehensive protection 
              solutions for modern digital infrastructure.
            </p>
          </div>
          
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))',
            gap: '2rem',
            marginTop: '2rem'
          }}>
            <div style={{
              background: '#f8f9fa',
              padding: '1.5rem',
              borderRadius: '8px',
              border: '1px solid #e9ecef'
            }}>
              <h3 style={{ color: '#2c3e50', marginBottom: '1rem' }}>🛡️ Network Security</h3>
              <p style={{ color: '#666' }}>Advanced firewall protection and network monitoring</p>
            </div>
            
            <div style={{
              background: '#f8f9fa',
              padding: '1.5rem',
              borderRadius: '8px',
              border: '1px solid #e9ecef'
            }}>
              <h3 style={{ color: '#2c3e50', marginBottom: '1rem' }}>💻 Threat Intelligence</h3>
              <p style={{ color: '#666' }}>Real-time threat detection and response systems</p>
            </div>
            
            <div style={{
              background: '#f8f9fa',
              padding: '1.5rem',
              borderRadius: '8px',
              border: '1px solid #e9ecef'
            }}>
              <h3 style={{ color: '#2c3e50', marginBottom: '1rem' }}>🔒 Endpoint Security</h3>
              <p style={{ color: '#666' }}>Comprehensive endpoint protection and management</p>
            </div>
          </div>
        </div>
      );
    };
    
    // Combined Page Component
    const CombinedPage = () => {
      const handleCloseWindow = () => {
        window.close();
      };

      return (
        <div className="combined-page-container">
          <div className="combined-page-header">
            <h1>🚀 EVOX Complete Experience</h1>
            <button onClick={handleCloseWindow} className="close-window-btn">
              ✕ Close Window
            </button>
          </div>
          
          <div className="combined-sections">
            <div className="combined-section navbar-section">
              <h2 className="section-title">🧭 Navigation Bar</h2>
              <div className="section-content">
                <Navbar />
              </div>
            </div>
            
            <div className="combined-section hero-section">
              <h2 className="section-title">🌟 Hero Section</h2>
              <div className="section-content">
                <HeroSection />
              </div>
            </div>
            
            <div className="combined-section homepage-section">
              <h2 className="section-title">🏠 Home Page Content</h2>
              <div className="section-content">
                <HomePage />
              </div>
            </div>
          </div>
        </div>
      );
    };
    
    // Render the app
    ReactDOM.render(<CombinedPage />, document.getElementById('root'));
  </script>
</body>
</html>
